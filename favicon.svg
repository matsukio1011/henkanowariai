<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Linear Graph Line Gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="40%" stop-color="#3b82f6" />
      <stop offset="80%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Slope Triangle Gradient -->
    <linearGradient id="slopeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="6" stroke-opacity="0.3" />

  <!-- Subtle Grid Lines -->
  <g stroke="#334155" stroke-width="2" stroke-dasharray="6,6" opacity="0.45">
    <line x1="80" y1="140" x2="440" y2="140" />
    <line x1="80" y1="250" x2="440" y2="250" />
    <line x1="250" y1="70" x2="250" y2="430" />
    <line x1="360" y1="70" x2="360" y2="430" />
  </g>

  <!-- Coordinate Axes -->
  <!-- X-Axis -->
  <line x1="70" y1="360" x2="440" y2="360" stroke="#64748b" stroke-width="7" stroke-linecap="round" />
  <polygon points="446,360 432,352 432,368" fill="#94a3b8" />
  <!-- Y-Axis -->
  <line x1="140" y1="440" x2="140" y2="70" stroke="#64748b" stroke-width="7" stroke-linecap="round" />
  <polygon points="140,64 132,78 148,78" fill="#94a3b8" />

  <!-- Axis Labels (X, Y, O) -->
  <text x="445" y="395" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" text-anchor="middle">x</text>
  <text x="110" y="80" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" text-anchor="middle">y</text>
  <text x="115" y="390" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" text-anchor="middle">O</text>

  <!-- Slope Triangle (Δx, Δy) -->
  <polygon points="240,270 360,270 360,160" fill="#f59e0b" fill-opacity="0.15" />
  <line x1="240" y1="270" x2="360" y2="270" stroke="url(#slopeGrad)" stroke-width="4" stroke-dasharray="6,4" stroke-linecap="round" />
  <line x1="360" y1="270" x2="360" y2="160" stroke="url(#slopeGrad)" stroke-width="4" stroke-dasharray="6,4" stroke-linecap="round" />

  <!-- Glow Underlay for Linear Graph Line -->
  <line x1="80" y1="416" x2="430" y2="96" stroke="url(#lineGrad)" stroke-width="32" stroke-linecap="round" opacity="0.35" filter="url(#softGlow)" />

  <!-- Main Linear Graph Line (y = ax + b) -->
  <line x1="80" y1="416" x2="430" y2="96" stroke="url(#lineGrad)" stroke-width="18" stroke-linecap="round" filter="url(#glow)" />

  <!-- Y-Intercept Point (0, b) -->
  <circle cx="140" cy="360" r="4" fill="#64748b" /> <!-- Origin marker -->
  <circle cx="140" cy="360" r="1" fill="#fff" />
  <g filter="url(#glow)">
    <!-- Cut / Intercept Point on y-axis at (140, 308) -->
    <circle cx="140" cy="360" r="0" />
    <circle cx="140" cy="360" r="0" />
    <!-- Point 1: Intercept (140, 360 - 52 = 308) -->
    <circle cx="140" cy="360" r="0" />
  </g>

  <!-- Point 1: Intercept (0, b) at (140, 360) where line passes -->
  <!-- When x=140: y = 416 - (416-96)/(430-80)*(140-80) = 416 - 320/350*60 = 416 - 54.8 = 361.2 => exactly near axis! -->
  <circle cx="140" cy="361" r="14" fill="#06b6d4" opacity="0.4" filter="url(#glow)" />
  <circle cx="140" cy="361" r="8" fill="#38bdf8" />
  <circle cx="140" cy="361" r="4" fill="#ffffff" />

  <!-- Point 2: Slope Step Start (240, 270) -->
  <circle cx="240" cy="270" r="9" fill="#818cf8" filter="url(#glow)" />
  <circle cx="240" cy="270" r="4.5" fill="#ffffff" />

  <!-- Point 3: Target Point (360, 160) -->
  <circle cx="360" cy="160" r="18" fill="#f43f5e" opacity="0.4" filter="url(#softGlow)" />
  <circle cx="360" cy="160" r="11" fill="#ec4899" filter="url(#glow)" />
  <circle cx="360" cy="160" r="5.5" fill="#ffffff" />

  <!-- Top Decorative Badge / Text "y = ax + b" -->
  <g transform="translate(245, 52)">
    <rect x="0" y="0" width="195" height="42" rx="21" fill="#1e293b" fill-opacity="0.8" stroke="#818cf8" stroke-width="2" />
    <text x="97" y="27" fill="#e2e8f0" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" text-anchor="middle" letter-spacing="1">
      y = ax + b
    </text>
  </g>
</svg>
