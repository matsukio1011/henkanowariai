<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>放物線の公式道場</title><meta name="description" content="図を見て、4択で直線の式と三角形の面積の公式を覚えよう。"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23192943'/%3E%3Cpath d='M5 6Q16 43 27 6M7 12L18 25L25 12Z' fill='none' stroke='%236fe0ca' stroke-width='2'/%3E%3C/svg%3E"><script>try{if(localStorage.getItem('parabola-theme')==='dark')document.documentElement.dataset.theme='dark';}catch{}</script><link rel="stylesheet" href="style.css"></head>
<body><main class="app"><header><div class="brand"><span class="mark">∪</span><div><small>図で覚える数学</small><h1>放物線の公式道場</h1></div></div><div class="score"><button id="fullscreen-toggle" type="button" aria-pressed="false" title="全画面表示切替 ([F]キー)"><span class="fs-icon">⛶</span> 全画面</button><button id="mode-menu" type="button" class="text-button" hidden>問題を選ぶ</button><button id="theme-toggle" type="button" aria-pressed="false">ダークモード</button><span id="count">第1問</span><span id="score">正解 0 問 · 回答 0 問</span></div></header>
<section id="mode-picker" class="mode-picker"><div><span class="eyebrow">放物線の公式を練習</span><h2>どっちの問題に挑戦する？</h2><p>図を見て4択から選ぶんだ！</p></div><div class="mode-cards"><button id="choose-area" class="mode-card"><span class="mode-symbol">△</span><strong>直線の式と面積</strong><span>2点を通る直線の式と<br>三角形の面積をまとめて答える</span></button><button id="choose-parallel" class="mode-card"><span class="mode-symbol">∥</span><strong>平行な2直線とx座標</strong><span>AB ∥ CD を手がかりに<br>残り1点のx座標と傾きを答える</span></button></div></section><section class="workspace" hidden><div class="diagram-panel"><div class="panel-top"><span class="eyebrow">放物線上の3点</span><span class="equation" id="equation"></span></div><div class="graph-wrap"><svg id="graph" viewBox="0 0 760 530" role="img" aria-label="放物線と三角形ABCの図"></svg></div><div class="legend"><span><i class="blue"></i>放物線</span><span><i class="orange"></i>三角形 ABC</span><span><i class="purple"></i><b id="target-line"></b></span></div><div class="parameters" id="parameters"></div><div class="custom"><button id="edit" class="text-button">数値を変えて練習</button><span>条件：a ≠ 0、p &lt; q &lt; r</span></div><form id="custom-form" hidden><div class="inputs"><label>a<select id="a-input"><option value="0.25">¼</option><option value="0.5">½</option><option value="1" selected>1</option><option value="2">2</option><option value="3">3</option><option value="-0.25">−¼</option><option value="-0.5">−½</option><option value="-1">−1</option><option value="-2">−2</option><option value="-3">−3</option></select></label><label>p<input id="p-input" type="number" min="-8" max="8" step="1" value="-2" required></label><label>q<input id="q-input" type="number" min="-8" max="8" step="1" value="1" required></label><label>r<input id="r-input" type="number" min="-8" max="8" step="1" value="3" required></label><button class="apply" type="submit">出題</button></div><p id="error" role="alert"></p></form></div>
<aside class="quiz-panel"><div><span class="eyebrow">LINE & AREA QUIZ</span><h2 id="question-title"></h2><p class="intro">直線の式と面積の組み合わせを選ぼう。</p></div><div id="choices" class="choices"></div><div id="feedback" class="feedback" aria-live="polite"><strong>3つの「横の差」がカギだぞ。</strong><span>まずは自分で計算してみよう。</span></div><button id="next" class="next">次の問題 <span>→</span></button><div class="hint"><button id="hint-toggle" aria-expanded="false">公式を見る <span>＋</span></button><div id="formula" hidden><div class="math">S = <span class="frac"><span>1</span><span>2</span></span>|a|(q − p)(r − q)(r − p)</div><p>「半分 × |a| × 3つの差」だ！</p></div></div></aside></section><footer><span>p &lt; q &lt; r ｜ a が負でも面積は正</span><span>キー 1〜4 で回答 · Enter で次へ · F で全画面</span></footer></main><script src="app.js"></script></body></html>
